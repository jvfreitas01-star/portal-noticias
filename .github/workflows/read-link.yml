# "Ler link": roda quando a página acrescenta um endereço (cifrado) a reader/queue.jsonl.
# Baixa a matéria, extrai o texto e grava cifrado em reader/links.json; a página abre no leitor.
name: Ler link

on:
  push:
    paths:
      - reader/queue.jsonl
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ler-link
  cancel-in-progress: false

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Ler os links da fila
        env:
          READER_PASSWORD: ${{ secrets.READER_PASSWORD }}
          PYTHONPATH: src
        run: python -m portal.readlink

      - name: Gravar
        run: |
          git config user.name "portal-bot"
          git config user.email "portal-bot@users.noreply.github.com"
          git add reader
          git commit -m "ler link" || { echo "nada novo"; exit 0; }
          for i in 1 2 3; do git pull --rebase -q && git push && exit 0; sleep 5; done
          exit 1
